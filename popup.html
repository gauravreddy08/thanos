<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        background: #121214;
        color: #f5f5f7;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .label {
        margin: 10px 0 6px;
        color: #a1a1a6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .toggle {
        display: flex;
        padding: 3px;
        border-radius: 8px;
        background: #2c2c2e;
      }
      .toggle button {
        flex: 1;
        padding: 6px 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #a1a1a6;
        font: inherit;
        cursor: pointer;
      }
      .toggle button.on {
        background: #48484a;
        color: #fff;
      }
      .hint {
        margin-top: 12px;
        color: #8e8e93;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Project Thanos</h1>
    <div class="label">Effect</div>
    <div class="toggle" data-key="effect">
      <button data-value="thanos">Thanos</button>
      <button data-value="highlight">Highlight</button>
    </div>
    <div class="label">Engine</div>
    <div class="toggle" data-key="engine">
      <button data-value="tree">Tree</button>
      <button data-value="sentences">Sentences</button>
    </div>
    <div class="hint">Hold ⌥ to ask · double-tap ⌥ to clear</div>
    <script src="popup.js"></script>
  </body>
</html>
